<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Queue Manager | Home</title>
    <meta name="portable-queue" content="portable-queue" />
    <meta name="apple-mobile-web-app-title" content="Queue Manager" />
    <meta name="theme-color" content="#134087" />
    <link rel="apple-touch-icon" href="assets/img/ico.png" sizes="180x180" />
    <link rel="icon" type="image/png" href="assets/img/ico.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="assets/img/ico.png" sizes="16x16" />

    <script src="assets/js/solid.js"></script>
    <script src="assets/js/fontawesome.js"></script>

    <style>
      /* #content becomes a column of exactly viewport height. The navbar
       keeps its natural size; #queue and #commercial split whatever
       height remains 50/50 — so neither one lets the other peek
       through, regardless of window size. */
      #content {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      #queue,
      #commercial {
        flex: 1 1 0;
        display: flex;
        align-items: center;
      }
      #queue .container,
      #commercial .container {
        width: 100%;
      }

      /* Queue table: two side-by-side "Station | Now serving" tables,
       same blue/white theme as before, centered and uniform. */
      .queue-table {
        margin-bottom: 0;
        border: 1px solid #e9ecef;
      }
      .queue-table thead th {
        background: #fff;
        color: #212529;
        text-align: center;
        vertical-align: middle;
        font-size: 1.4rem;
        font-weight: 600;
        border-bottom: 2px solid #134087;
      }
      .queue-table tbody td {
        background: #134087;
        color: #fff;
        text-align: center;
        vertical-align: middle;
        font-size: 1.5rem;
        padding: 1rem;
        border-color: rgba(255, 255, 255, 0.15);
      }
      .queue-table tbody td .badge {
        font-size: 1.4rem;
        padding: 0.5rem 1rem;
        min-width: 90px;
      }
    </style>
  </head>

  <body>
    <div class="wrapper">
      <nav id="sidebar">
        <div class="sidebar-header">
          <h3>Queue Manager</h3>
        </div>
        <ul class="list-unstyled components">
          <li>
            <a href="#queue">Queue</a>
          </li>
          <li>
            <a href="#commercial">Commercial</a>
          </li>
        </ul>
        <ul class="list-unstyled CTAs">
          <li>
            <a>Queue Display</a>
          </li>
        </ul>
      </nav>

      <div id="content">
        <nav class="navbar navbar-expand-lg bg-light">
          <div class="container-fluid">
            <button type="button" id="sidebarCollapse" class="btn btn-info">
              <i class="fas fa-align-left"></i>
              <span></span>
            </button>
            <ul class="nav navbar-nav ms-auto">
              <li class="nav-item active">
                <a class="nav-link" href="#"
                  ><span id="datetime" class="badge rounded-pill text-bg-dark"
                    >Time Placeholder</span
                  ></a
                >
              </li>
            </ul>
          </div>
        </nav>
        <section id="queue">
          <div class="container">
            <div class="row">
              <div class="col-md-6">
                <table class="table queue-table">
                  <thead>
                    <tr>
                      <th>Station</th>
                      <th>Now serving</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td>C1</td>
                      <td>
                        <span class="badge text-bg-light" data-counter-id="c1"
                          >—</span
                        >
                      </td>
                    </tr>
                    <tr>
                      <td>C2</td>
                      <td>
                        <span class="badge text-bg-light" data-counter-id="c2"

                      </td>
                    </tr>
                    <tr>
                      <td>C3</td>
                      <td>
                        <span class="badge text-bg-light" data-counter-id="c3"

                        >
                      </td>
                    </tr>
                    <tr>
                      <td>C4</td>

                          >—</span
                        >
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
              <div class="col-md-6">
                <table class="table queue-table">
                  <thead>
                    <tr>
                      <th>Station</th>
                      <th>Now serving</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td>C5</td>
                      <td>
                        <span class="badge text-bg-light" data-counter-id="c5"
                          >—</span
                        >

                    <tr>
                      <td>C6</td>
                      <td>
                        <span class="badge text-bg-light" data-counter-id="c6"
                          >—</span
                        >
                      </td>
                    </tr>
                    <tr>
                      <td>PWD</td>
                      <td>
                        <span class="badge text-bg-light" data-counter-id="pwd"

                      </td>
                    </tr>
                    <tr>
                      <td>ESCAL</td>
                      <td>
                        <span
                          class="badge text-bg-light"

                      </td>

                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </section>
        <div class="line"></div>
        <section id="commercial">
          <div class="container">
            <div class="row">
              <iframe
                width="800"

                src="https://www.youtube.com/embed/mF3n6my4L3w?autoplay=1&loop=1&mute=1"

    <script type="text/javascript" src="assets/js/display.js"></script>
  </body>
</html>
